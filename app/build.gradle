plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.storepilot'
    compileSdk 34

    defaultConfig {
        applicationId "com.storepilot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'androidx.fragment:fragment:1.6.2'

    // Firebase BoM - يدير إصدارات Firebase تلقائياً
    implementation platform('com.google.firebase:firebase-bom:32.7.4')

    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'

    // Firebase Firestore - للبيانات المنظمة (Products, Sales, Purchases, Tasks, Seasons, VideoMetrics)
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Realtime Database - للبيانات الفورية (Dashboard stats, Online presence)
    implementation 'com.google.firebase:firebase-database'

    // Firebase Storage - لتخزين صور المنتجات
    implementation 'com.google.firebase:firebase-storage'

    // Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'
}
